name: Refresh Argo metadata

# Rebuilds the searchable float index so newly-deployed Argo floats show up.
# Incremental: the meta.nc files are cached between runs, so each run only
# downloads metadata for floats that are new since last time. The bulky data
# is never stored; it is still fetched on demand by the app.

on:
  schedule:
    - cron: "17 5 * * *"      # daily, 05:17 UTC
  workflow_dispatch: {}        # allow manual "Run workflow"

# only one refresh at a time; let a run finish rather than cancel it
concurrency:
  group: refresh-metadata
  cancel-in-progress: false

permissions:
  contents: write              # to commit the updated parquets back

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0       # full history so the push-retry rebase below works

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install (only the sync + crosswalk deps)
        run: pip install pandas numpy requests tqdm netCDF4 pyarrow

      # Cache the downloaded meta.nc + index between runs. A unique key always
      # saves a fresh cache; restore-keys pulls the most recent prior one, so
      # only NEW floats' metadata is downloaded each run.
      - name: Restore metadata cache
        uses: actions/cache@v5
        with:
          path: argo_local
          key: argo-meta-${{ github.run_id }}
          restore-keys: |
            argo-meta-

      - name: Refresh index (new floats only; cached metas are skipped)
        run: |
          python sync_bgc_subset.py --root ./argo_local \
            --dataset both --meta-only --limit-floats 0 --refresh-index
          python build_crosswalk.py --root ./argo_local
          python build_api.py --root ./argo_local --out ./docs/api

      # The API files are rebuilt above, so the sitemap's lastmod is only honest if it
      # moves with them. Stamp it here rather than by hand, where it went 12 days stale.
      - name: Stamp sitemap lastmod
        run: |
          python - <<'PY'
          import re, datetime, pathlib
          p = pathlib.Path("docs/sitemap.xml")
          today = datetime.date.today().isoformat()
          p.write_text(re.sub(r"<lastmod>[^<]*</lastmod>",
                              f"<lastmod>{today}</lastmod>", p.read_text()))
          print("sitemap lastmod ->", today)
          PY

      - name: Commit updated index if new floats appeared
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # stage only the data parquets; manifest.json holds a timestamp that
          # changes every run, so add it only when the parquets actually changed
          git add argo_local/sensors.parquet argo_local/floats.parquet \
                  argo_local/bgc_float_index.parquet docs/api/ docs/sitemap.xml
          if git diff --cached --quiet; then
            echo "No new floats this run; nothing to commit."
            exit 0
          fi
          git add argo_local/manifest.json
          git commit -m "chore: daily Argo metadata refresh [skip ci]"
          # Push, retrying against concurrent pushes to main. Our freshly-built
          # files are the source of truth, so on a rebase conflict we keep ours.
          # (In a rebase, "theirs" is the commit being replayed, i.e. this one.)
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed refreshed index; Streamlit Cloud will redeploy."
              pushed=1; break
            fi
            echo "Push rejected (main moved); rebasing onto latest (attempt $attempt)."
            git fetch origin main
            git rebase -X theirs FETCH_HEAD || { git rebase --abort; break; }
            sleep 3
          done
          if [ "$pushed" != "1" ]; then
            echo "Could not push after 5 attempts."
            exit 1
          fi
